<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>별사탕 줍기 — 수퍼클라우드 모드</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10142b;color:#f7f3ff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #ffe28c;outline-offset:3px}.wrap{max-width:560px;margin:auto;padding:18px 16px max(18px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.eyebrow{font-size:10px;color:#b3a4ff;letter-spacing:2px}h1{font-size:23px;margin:4px 0;letter-spacing:-1px}.smallbtn{border:1px solid #69668f;background:#252742;color:#fff;border-radius:12px;padding:10px 13px}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{background:#20233e;border:1px solid #343650;border-radius:13px;padding:11px 12px}.stat small{display:block;font-size:10px;color:#aaa9c8;margin-bottom:4px}.stat strong{font-size:21px;font-variant-numeric:tabular-nums}.meta{display:flex;justify-content:space-between;font-size:11px;color:#c3bce3;padding:12px 2px 8px;gap:8px;flex-wrap:wrap}.timer{height:4px;background:#33334f;border-radius:10px;overflow:hidden;margin-bottom:10px}.timer div{height:100%;background:linear-gradient(90deg,#b39bff,#ffe499);width:100%}.arena{position:relative;border:1px solid #44415f;border-radius:23px;overflow:hidden;background:#171b38}canvas{width:100%;display:block;aspect-ratio:480/560;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;overscroll-behavior:contain;background:#11172bd9;padding:22px;backdrop-filter:blur(7px)}.panel{text-align:center;width:100%;max-width:350px;margin:auto 0;flex-shrink:0}.pill{display:inline-block;color:#ffe6ab;border:1px solid #877855;padding:5px 11px;border-radius:20px;font-size:10px;letter-spacing:1px}.panel h2{font-size:31px;line-height:1.25;margin:16px 0}.panel p{font-size:13px;line-height:1.8;color:#cac6df}.rules{text-align:left;display:grid;gap:8px;margin:20px 0;font-size:12px;color:#ece5fc}.rules div{background:#ffffff09;border-radius:9px;padding:9px 12px}.primary{width:100%;border:0;border-radius:13px;background:#d6c7ff;color:#29213e;padding:14px;font-weight:800;margin-top:9px}.secondary{width:100%;border:1px solid #77708f;border-radius:13px;background:transparent;color:white;padding:12px;margin-top:10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}.move{border:1px solid #494563;background:#252640;color:#eee9ff;padding:13px;border-radius:14px;font-size:22px;user-select:none;-webkit-user-select:none;touch-action:none}.foot{font-size:11px;color:#b0a8c9;text-align:center;line-height:1.8;margin:13px 0 0}.hidden{display:none}.record{font-size:42px;font-weight:800;color:#ffe2a0;margin:10px 0}.summary{font-size:12px;color:#c6bfe0;line-height:1.9}.urgent{color:#ffaeaa!important}@media(max-height:740px){.wrap{padding-top:10px}.stat{padding:8px 12px}.meta{padding-top:8px}h1{font-size:20px}canvas{aspect-ratio:480/500}.foot{margin-top:7px}.move{padding:9px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">STAR CANDY / SUPER CLOUD</div><h1>별사탕 줍기</h1></div><button id="pause" class="smallbtn" disabled>일시정지</button></header><section class="hud" aria-label="게임 상태"><div class="stat"><small>점수</small><strong id="score">0</strong></div><div class="stat"><small>남은 시간</small><strong id="time">60초</strong></div><div class="stat"><small>하트</small><strong id="hp" aria-label="하트 3개">♥ ♥ ♥</strong></div></section><div class="meta"><span id="stage">1단계 · 산뜻한 출발</span><span id="combo">콤보 0 · ×1</span><span id="best">최고 0</span></div><div class="timer"><div id="timebar"></div></div><section class="arena"><canvas id="game" width="480" height="560" aria-label="별사탕을 받고 먹구름을 피하는 게임. 방향키 또는 화면 드래그로 조작합니다."></canvas><div id="overlay" class="overlay"><div class="panel" id="panel"></div></div></section><div class="controls"><button class="move" id="left" aria-label="왼쪽으로 이동">←</button><button class="move" id="right" aria-label="오른쪽으로 이동">→</button></div><p class="foot">컴퓨터: ← → 또는 A / D · 휴대폰: 드래그 / 화살표 버튼<br>P·Esc: 일시정지 · 별사탕을 놓치거나 먹구름에 맞으면 콤보 초기화</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),W=480,H=560,DURATION=60,KEY='star_candy_supercloud_60_best_v1';
let best=0;try{const stored=Number(localStorage.getItem(KEY));best=Number.isFinite(stored)?Math.max(0,Math.floor(stored)):0}catch(e){}
let mode='ready',run=null,last=0,held=new Set(),target=null,drag=false,fx=[],items=[],spawn=0;
const stars=Array.from({length:45},(_,i)=>({x:(i*137.3)%W,y:(i*79.7)%H,r:i%4===0?1.6:.8}));
let bossClock=8,warnings=[];
const labels=['산뜻한 출발','속도를 올려!','구름 주의보','별빛 폭주','마지막 스퍼트'];
function reset(){$('pause').textContent='일시정지';bossClock=8;warnings=[];held.clear();target=null;drag=false;items=[];fx=[];spawn=.4;run={x:W/2,t:0,hp:3,score:0,combo:0,maxCombo:0,caught:0,rainbow:0,shield:0,magnet:0,inv:0,stage:1,flash:0};mode='playing';$('overlay').classList.add('hidden');$('pause').disabled=false;last=performance.now();hud()}
function hud(){const r=run;$('best').textContent='최고 '+best.toLocaleString();if(!r)return;$('score').textContent=r.score.toLocaleString();$('time').textContent=Math.ceil(Math.max(0,DURATION-r.t))+'초';$('time').classList.toggle('urgent',DURATION-r.t<=15);$('hp').textContent='♥ '.repeat(r.hp).trim()||'—';$('hp').setAttribute('aria-label','하트 '+r.hp+'개');$('stage').textContent=r.stage+'단계 · '+labels[r.stage-1];$('combo').textContent='콤보 '+r.combo+' · ×'+mult();$('timebar').style.width=Math.max(0,1-r.t/DURATION)*100+'%'}
function mult(){return Math.min(5,1+Math.floor((run?.combo||0)/5))}
function panel(html){$('panel').innerHTML=html;$('overlay').classList.remove('hidden')}
function intro(){panel(`<span class="pill">SUPER CLOUD CHALLENGE</span><h2>반짝임을 모아,<br>끝까지 살아남아!</h2><p>하트 3개로 60초에 도전하세요.<br>거대 먹구름이 9초 간격으로 출현!<br>경고 구역을 보고 빠르게 피하세요.</p><div class="rules"><div>★ 별사탕 10점 · 무지개 별사탕 50점</div><div>연속 5개마다 배율 상승 · 최대 ×5</div><div>🧲 자석 7초 · 🛡 보호막 최대 2회</div><div>먹구름 −1 · 수퍼클라우드 −2 하트</div><div>1.4초 사전 경고 · 보호막으로 1회 방어</div></div><button class="primary" data-act="start">도전 시작</button><p style="font-size:11px">최고 기록 ${best.toLocaleString()}점 · 이 브라우저에 저장</p>`)}
function pause(){if(mode==='playing'){mode='paused';held.clear();drag=false;target=null;$('pause').textContent='계속하기';panel(`<span class="pill">TAKE A BREATH</span><h2>잠깐 쉬어 가요</h2><p>시간과 아이템 효과도 멈췄어요.</p><button class="primary" data-act="resume">계속하기</button><button class="secondary" data-act="restart">처음부터 다시</button>`)}else if(mode==='paused'){mode='playing';last=performance.now();$('overlay').classList.add('hidden');$('pause').textContent='일시정지'}}
function finish(clear){mode='over';held.clear();target=null;drag=false;$('pause').disabled=true;const isNew=run.score>best;if(isNew){best=run.score;try{localStorage.setItem(KEY,String(best))}catch(e){}}hud();panel(`<span class="pill">${clear?'60 SECONDS COMPLETE':'TRY AGAIN'}</span><h2>${clear?'60초 생존 성공!':'다음엔 더 멀리!'}</h2><div class="record">${run.score.toLocaleString()}<span style="font-size:15px">점</span></div><div class="summary">${isNew?'새로운 최고 기록!<br>':''}최대 콤보 ${run.maxCombo} · 받은 별사탕 ${run.caught}개<br>무지개 ${run.rainbow}개 · 생존 ${Math.min(60,Math.floor(run.t))}초<br>최고 기록 ${best.toLocaleString()}점</div><button class="primary" data-act="start">다시 도전</button><button class="secondary" data-act="intro">게임 방법</button>`)}
function text(x,y,t,color='#ffe5a0'){fx.push({x,y,t,color,life:1.1})}
function makeItem(){const st=run.stage;let p=Math.random(),type=p<.01?'shield':p<.02?'magnet':p<.05?'rainbow':p<.05+.34+st*.04?'cloud':'star';let x=26+Math.random()*(W-52);if(type==='cloud'&&items.some(i=>i.type==='cloud'&&i.y<90&&Math.abs(i.x-x)<95)){type='star'}items.push({type,x,y:-30,r:type==='cloud'?23:16,vy:((type==='cloud'?137:153)+st*27+Math.random()*27)*1.10,phase:Math.random()*6.28})}
function update(dt){const r=run;r.t=Math.min(DURATION,r.t+dt);const next=Math.min(5,1+Math.floor(r.t/12));if(next!==r.stage){r.stage=next;text(W/2,170,'LEVEL '+next+' · '+labels[next-1],'#d7c5ff')}
r.inv=Math.max(0,r.inv-dt);r.magnet=Math.max(0,r.magnet-dt);r.flash=Math.max(0,r.flash-dt);let dx=(held.has('right')||held.has('ArrowRight')||held.has('d')?1:0)-(held.has('left')||held.has('ArrowLeft')||held.has('a')?1:0);
if(dx){r.x+=dx*430*dt;target=null}else if(target!==null){r.x+=Math.max(-510*dt,Math.min(510*dt,target-r.x))}r.x=Math.max(29,Math.min(W-29,r.x));
bossClock-=dt;
if(bossClock<=0){warnings.push({x:Math.max(65,Math.min(W-65,r.x)),left:1.4});bossClock=9}
for(let wi=warnings.length-1;wi>=0;wi--){const warning=warnings[wi];warning.left-=dt;if(warning.left<=0){items.push({type:'super',x:warning.x,baseX:warning.x,y:-65,r:44,vy:(240+r.stage*22)*1.40,phase:0});warnings.splice(wi,1)}}
spawn-=dt;while(spawn<=0){makeItem();spawn+=Math.max(.27,.65-(r.stage-1)*.08)}
for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.vy*dt;it.phase+=dt*2;if(it.type==='super'){it.x=Math.max(48,Math.min(W-48,it.baseX+Math.sin(it.phase)*24))}
if(r.magnet>0&&['star','rainbow'].includes(it.type)&&it.y>H-235&&Math.abs(it.x-r.x)<145){it.x+=(r.x-it.x)*Math.min(1,dt*6)}
if(Math.abs(it.x-r.x)<(it.type==='super'?61:it.type==='cloud'?37:34)&&Math.abs(it.y-(H-47))<(it.type==='super'?44:25+it.r*.4)){
items.splice(i,1);
if(it.type==='cloud'||it.type==='super'){if(r.inv>0)continue;r.combo=0;r.inv=1.6;r.flash=.15;if(r.shield){r.shield--;text(r.x,H-95,'보호막 방어!','#a9f3ff')}else{r.hp=Math.max(0,r.hp-(it.type==='super'?2:1));text(r.x,H-95,it.type==='super'?'수퍼클라우드! 하트 −2':'하트 −1','#ffaaa8');if(r.hp<=0){finish(false);return}}}
else if(it.type==='shield'){r.shield=Math.min(2,r.shield+1);text(r.x,H-95,'보호막 +1','#a9f3ff')}
else if(it.type==='magnet'){r.magnet=7;text(r.x,H-95,'자석 7초','#d6b5ff')}
else{r.combo++;r.maxCombo=Math.max(r.maxCombo,r.combo);r.caught++;if(it.type==='rainbow')r.rainbow++;let points=(it.type==='rainbow'?50:10)*mult();r.score+=points;text(it.x,it.y-30,'+'+points,it.type==='rainbow'?'#ffb9e4':'#ffe5a0')}
}else if(it.y>H+35){items.splice(i,1);if(it.type==='star'||it.type==='rainbow'){if(r.combo>=5)text(W/2,H-125,'놓쳤어요 · 콤보 초기화','#b5accb');r.combo=0}}
}
for(let i=fx.length-1;i>=0;i--){fx[i].life-=dt;fx[i].y-=26*dt;if(fx[i].life<=0)fx.splice(i,1)}
hud();if(r.t>=DURATION)finish(true)}
function star(x,y,r,color,rotation=0){ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.beginPath();for(let j=0;j<10;j++){let a=-Math.PI/2+j*Math.PI/5,d=j%2?r*.47:r;j?ctx.lineTo(Math.cos(a)*d,Math.sin(a)*d):ctx.moveTo(Math.cos(a)*d,Math.sin(a)*d)}ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore()}
function round(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171d3c');g.addColorStop(1,'#343052');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(const s of stars){ctx.globalAlpha=.25+.3*(Math.sin((run?.t||0)+s.x)+1)/2;ctx.fillStyle='#eee3ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;
ctx.fillStyle='#514361';ctx.beginPath();ctx.ellipse(W/2,H+43,360,82,0,0,7);ctx.fill();
const r=run||{x:W/2,t:0,inv:0,shield:0,magnet:0};
for(const warning of warnings){ctx.save();ctx.fillStyle='#ff63751a';ctx.fillRect(warning.x-86,0,172,H);ctx.strokeStyle='#ff889b';ctx.lineWidth=2;ctx.setLineDash([7,7]);ctx.strokeRect(warning.x-86,0,172,H);ctx.setLineDash([]);ctx.fillStyle='#ffc2c9';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('수퍼클라우드 주의!',W/2,58);ctx.font='12px system-ui';ctx.fillText(Math.max(0,warning.left).toFixed(1)+'초 뒤 출현 · 경고 구역을 피하세요',W/2,78);ctx.restore()}
for(const it of items){ctx.save();ctx.translate(it.x,it.y);
if(it.type==='star'){star(0,0,17,'#ffe49c',Math.sin(it.phase)*.3);star(-3,-4,5,'#fff7ce')}
else if(it.type==='rainbow'){const gr=ctx.createLinearGradient(-18,-18,18,18);gr.addColorStop(0,'#ffaccc');gr.addColorStop(.5,'#d6b3ff');gr.addColorStop(1,'#93f4ec');star(0,0,20,gr,it.phase*.3);ctx.strokeStyle='#fff6';ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.stroke()}
else if(it.type==='super'){ctx.shadowColor='#d678fa';ctx.shadowBlur=18;ctx.fillStyle='#5d426f';ctx.beginPath();ctx.arc(-25,5,25,0,7);ctx.arc(0,-8,33,0,7);ctx.arc(27,7,24,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffbcdf';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-18,-4);ctx.lineTo(-7,0);ctx.moveTo(18,-4);ctx.lineTo(7,0);ctx.stroke();ctx.fillStyle='#ffdf78';ctx.beginPath();ctx.moveTo(-3,12);ctx.lineTo(-12,29);ctx.lineTo(-2,27);ctx.lineTo(-8,42);ctx.lineTo(13,19);ctx.lineTo(3,21);ctx.closePath();ctx.fill();ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffe4f4';ctx.fillText('SUPER',0,-18)}
else if(it.type==='cloud'){ctx.fillStyle='#8589a7';ctx.beginPath();ctx.arc(-13,3,13,0,7);ctx.arc(0,-4,17,0,7);ctx.arc(15,4,12,0,7);ctx.fill();ctx.fillStyle='#30334f';ctx.fillRect(-7,1,3,4);ctx.fillRect(5,1,3,4);ctx.strokeStyle='#41435e';ctx.beginPath();ctx.moveTo(-5,11);ctx.lineTo(5,11);ctx.stroke()}
else{round(-17,-17,34,34,11,it.type==='shield'?'#a9f1ed':'#d8b5ff');ctx.fillStyle='#35304e';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.type==='shield'?'S':'U',0,1)}ctx.restore()}
if(r.magnet>0){ctx.strokeStyle='#d4b7ff55';ctx.setLineDash([5,7]);ctx.beginPath();ctx.ellipse(r.x,H-60,115,60,0,0,7);ctx.stroke();ctx.setLineDash([])}
ctx.save();if(r.inv>0&&Math.floor(r.inv*10)%2===0)ctx.globalAlpha=.4;
if(r.shield){ctx.strokeStyle='#a7f8f0';ctx.lineWidth=2;ctx.fillStyle='#a7f8f013';ctx.beginPath();ctx.arc(r.x,H-48,38,0,7);ctx.fill();ctx.stroke()}
round(r.x-25,H-61,50,30,9,'#d4b7f3','#f4d7ff');round(r.x-29,H-66,58,10,5,'#f1d6ff');ctx.fillStyle='#5c456e';ctx.beginPath();ctx.arc(r.x-8,H-48,2.4,0,7);ctx.arc(r.x+8,H-48,2.4,0,7);ctx.fill();ctx.strokeStyle='#795b8a';ctx.beginPath();ctx.arc(r.x,H-44,5,0,Math.PI);ctx.stroke();ctx.restore();
if(r.shield||r.magnet>0){ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillStyle='#e6dcff';ctx.fillText((r.shield?'보호막 '+r.shield+'회   ':'')+(r.magnet>0?'자석 '+Math.ceil(r.magnet)+'초':''),15,25)}
for(const f of fx){ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.color;ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(f.t,Math.max(80,Math.min(W-80,f.x)),f.y)}ctx.globalAlpha=1;if(r.flash>0){ctx.fillStyle='#ffa9b320';ctx.fillRect(0,0,W,H)}}
function frame(now){let remaining=Math.max(0,(now-last)/1000);last=now;
if(mode==='playing'){if(remaining>.5){pause()}else{while(remaining>1e-8&&mode==='playing'){const step=Math.min(.04,remaining);update(step);remaining-=step}}}
draw();requestAnimationFrame(frame)}
$('panel').addEventListener('click',e=>{let a=e.target.closest('[data-act]')?.dataset.act;if(a==='start'){reset();$('pause').textContent='일시정지'}else if(a==='resume')pause();else if(a==='restart'){reset();$('pause').textContent='일시정지'}else if(a==='intro'){mode='ready';intro()}});
$('pause').addEventListener('click',pause);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){if(mode==='playing'){e.preventDefault();held.add(e.key.length===1?e.key.toLowerCase():e.key)}}if(!e.repeat&&['p','P','Escape'].includes(e.key))pause()});
window.addEventListener('keyup',e=>held.delete(e.key.length===1?e.key.toLowerCase():e.key));
function point(e){const rect=canvas.getBoundingClientRect();target=Math.max(29,Math.min(W-29,(e.clientX-rect.left)/rect.width*W))}
canvas.addEventListener('pointerdown',e=>{if(mode!=='playing')return;e.preventDefault();drag=true;point(e);canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag&&mode==='playing')point(e)});
function release(){drag=false;target=null}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
for(const dir of ['left','right']){const b=$(dir);b.addEventListener('pointerdown',e=>{if(mode!=='playing')return;e.preventDefault();b.setPointerCapture(e.pointerId);held.add(dir);target=null});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>held.delete(dir))}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});window.addEventListener('blur',()=>{held.clear();if(mode==='playing')pause()});
hud();intro();requestAnimationFrame(t=>{last=t;frame(t)});
</script></body></html>
